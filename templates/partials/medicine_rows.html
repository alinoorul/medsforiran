<script>
  // Show action column if admin is currently unlocked
  (function() {
    if (document.body.classList.contains('admin-unlocked')) {
      console.log('hello')
      document.querySelectorAll('.action-cell').forEach(el => el.style.display = '');
      document.querySelectorAll('th .admin-only').forEach(el => el.style.display = '');
    }
  })();
</script>
{% if medicines %}
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Generic Code</th>
        <th>Medicine Name</th>
        <th>Manufacturers</th>
        <th>Qty Required</th>
        <th class="admin-only">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for m in medicines %}
      <tr id="med-row-{{ m.id }}">
        <td data-label="Serial">{{ m.serial }}</td>
        <td data-label="Generic Code"><span class="pill">{{ m.generic_code }}</span></td>
        <td data-label="Medicine Name" style="font-weight:600;">{{ m.name }}</td>
        <td data-label="Manufacturers" style="color:var(--muted); font-size:.82rem;">{{ m.manufacturers }}</td>
        <td data-label="Qty Required">{{ m.quantity }}</td>
        <td data-label="Actions" class="action-cell admin-only">
          <div class="actions">
            <button
              class="btn btn-warning btn-sm"
              hx-get="/medicines/{{ m.id }}/edit"
              hx-target="#med-row-{{ m.id }}"
              hx-swap="outerHTML"
            >Edit</button>
            <button
              class="btn btn-danger btn-sm"
              hx-delete="/medicines/{{ m.id }}"
              hx-target="#medicine-list"
              hx-swap="innerHTML"
              hx-confirm="Delete '{{ m.name }}'?"
              hx-on::after-request="showToast('Medicine deleted')"
            >Delete</button>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>



{% else %}
<div class="empty">
  <div class="empty-icon"></div>
  <h3>No medicines yet</h3>
  <p>Add one manually or import a PDF above</p>
</div>
{% endif %}
